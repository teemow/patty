name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: teemow/github-workflows/.github/workflows/ci-go.yml@main
    with:
      runs-on: ubuntu-latest
  gitleaks:
    uses: teemow/github-workflows/.github/workflows/gitleaks.yml@main
    with:
      runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
  docs:
    # The shared ci-go workflow takes no extra steps, so the generated
    # documentation is checked in a job of its own.
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: generated docs are current
        run: make docs-check
